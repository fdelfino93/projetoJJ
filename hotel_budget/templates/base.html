<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ sistema_nome }}{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #64748b;
      --primary: #6a1b9a;
      --primary-dark: #4a148c;
      --green: #2e7d32;
      --green-bg: #e8f5e9;
      --red: #c62828;
      --red-bg: #fdecea;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      min-height: 100vh;
    }
    aside {
      width: 240px;
      background: var(--primary-dark);
      color: #fff;
      padding: 20px 0;
      flex-shrink: 0;
    }
    aside .brand {
      padding: 0 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,.15);
    }
    aside .brand h1 { font-size: 16px; line-height: 1.3; }
    aside .brand small { color: #d1c4e9; }
    aside nav a {
      display: block;
      padding: 12px 20px;
      color: #e1d7f0;
      text-decoration: none;
      font-size: 14px;
      border-left: 3px solid transparent;
    }
    aside nav a:hover, aside nav a.ativo {
      background: rgba(255,255,255,.08);
      color: #fff;
      border-left-color: #ce93d8;
    }
    main {
      flex: 1;
      padding: 24px 32px;
      max-width: 1100px;
    }
    header.top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    h2 { font-size: 20px; }
    .muted { color: var(--muted); font-size: 13px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 1px 3px rgba(15,23,42,.06);
    }
    .card h3 { font-size: 15px; margin-bottom: 12px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .card.kpi { text-align: center; }
    .card.kpi .valor { font-size: 22px; font-weight: 700; margin-top: 6px; }
    .card.kpi .rotulo { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .verde { color: var(--green); }
    .vermelho { color: var(--red); }
    .roxo { color: var(--primary); }
    .card.kpi.verde-bg { background: var(--green-bg); border-color: #a5d6a7; }
    .card.kpi.vermelho-bg { background: var(--red-bg); border-color: #ef9a9a; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; background: #f8fafc; }
    .right { text-align: right; }
    .btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn:hover { background: var(--primary-dark); }
    .btn.gray { background: #475569; }
    .btn.danger { background: var(--red); }
    .btn.danger:hover { background: #b71c1c; }
    .btn.small { padding: 4px 9px; font-size: 12px; }
    form.inline { display: inline; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      background: #fff;
    }
    form.filtro { display: flex; gap: 10px; align-items: flex-end; }
    form.filtro select { width: 220px; margin-bottom: 0; }
    .alerta {
      background: var(--red-bg);
      border: 1px solid #ef9a9a;
      color: var(--red);
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 14px;
      font-size: 13px;
    }
    .pbar { background: #eceff1; border-radius: 6px; height: 12px; overflow: hidden; }
    .pbar > div { height: 100%; background: var(--primary); }
    .pbar > div.alta { background: var(--green); }
    .pbar > div.baixa { background: var(--red); }
    .chart-img { width: 100%; height: auto; }
    .barchart { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .barchart .card { margin-bottom: 0; }
    .status-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .ok { background: var(--green-bg); color: var(--green); }
    .atencao { background: #fff8e1; color: #f9a825; }
    .critico { background: var(--red-bg); color: var(--red); }
    @media (max-width: 900px) {
      body { flex-direction: column; }
      aside { width: 100%; }
      .barchart { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <h1>{{ hotel_nome }}</h1>
      <small>{{ sistema_nome }} v{{ versao }}</small>
    </div>
    <nav>
      <a href="{{ url_for('pagina_dashboard') }}" class="{{ 'ativo' if request.endpoint == 'pagina_dashboard' else '' }}">Dashboard</a>
      <a href="{{ url_for('pagina_movimentacoes', tipo='receita') }}" class="{{ 'ativo' if request.endpoint == 'pagina_movimentacoes' and request.view_args and request.view_args.get('tipo') == 'receita' else '' }}">Receitas</a>
      <a href="{{ url_for('pagina_movimentacoes', tipo='despesa') }}" class="{{ 'ativo' if request.endpoint == 'pagina_movimentacoes' and request.view_args and request.view_args.get('tipo') == 'despesa' else '' }}">Despesas</a>
      <a href="{{ url_for('pagina_orcamento') }}" class="{{ 'ativo' if request.endpoint == 'pagina_orcamento' else '' }}">Orçamento</a>
      <a href="{{ url_for('pagina_relatorio') }}" class="{{ 'ativo' if request.endpoint == 'pagina_relatorio' else '' }}">Relatórios</a>
    </nav>
  </aside>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
