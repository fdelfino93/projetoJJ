{% extends "base.html" %}
{% block title %}Novo lançamento — {{ sistema_nome }}{% endblock %}
{% block content %}
{% set titulo = 'Receita' if tipo == 'receita' else 'Despesa' %}
<header class="top">
  <h2>Novo lançamento de {{ titulo|lower }}</h2>
</header>

{% if erro %}<div class="alerta">{{ erro }}</div>{% endif %}

<div class="card" style="max-width:480px;">
  <form method="post">
    <label for="data">Data</label>
    <input type="date" id="data" name="data" value="{{ request.form.get('data', '') }}" required>

    <label for="categoria">Categoria</label>
    <select id="categoria" name="categoria" required>
      <option value="">Selecione...</option>
      {% for cat in (receita_categorias if tipo == 'receita' else despesa_categorias) %}
      <option value="{{ cat }}" {{ 'selected' if request.form.get('categoria') == cat else '' }}>{{ cat }}</option>
      {% endfor %}
    </select>

    <label for="descricao">Descrição</label>
    <input type="text" id="descricao" name="descricao" value="{{ request.form.get('descricao', '') }}" placeholder="Opcional">

    <label for="valor">Valor (R$)</label>
    <input type="number" step="0.01" min="0" id="valor" name="valor" value="{{ request.form.get('valor', '') }}" required>

    <button class="btn" type="submit">Salvar</button>
    <a class="btn gray" href="{{ url_for('pagina_movimentacoes', tipo=tipo) }}">Cancelar</a>
  </form>
</div>
{% endblock %}
