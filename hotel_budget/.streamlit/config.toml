# Tema padrão do Streamlit. O usuário escolhe entre claro e escuro em
# Menu (⋮) > Settings > Appearance. As paletas validadas do sistema
# vivem em config.PALETAS e os gráficos trocam de cor via CSS em app.py.

[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#ffffff"
font = "sans serif"

[browser]
gatherUsageStats = false
